<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Event Tracker</title>
    <script type="module" src="dist/app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        svg {
            width: 95vmin;
            height: 95vmin;
            max-height: 100vh;
            max-width: 100vw;
            display: block;
            font: 10pt monospace;
        }

        .gradient-stop-1 {
            stop-color: #3BA6F5;
            stop-opacity: 1;

        }

        .gradient-stop-2 {
            stop-color: #59f9ff;
            stop-opacity: 1;

        }
    </style>
</head>

<body>
    <main>
        <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
            <defs></defs>
            <circle cx="200" cy="200" r="200" fill="none" stroke-width="1" stroke="#eee"></circle>
            <g id="radialBars"></g>
            <g id="dataLabels" transform="translate(200,200)"></g>
            <g id="valueLabels" transform="translate(200,200)"></g>
        </svg>
    </main>
</body>

</html>
