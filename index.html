<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Event Tracker</title>
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="dist/app.js"></script>
</head>

<body>
    <main>
        <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
            <defs></defs>
            <circle id="border" cx="200" cy="200" r="200"></circle>
            <circle id="button" cx="200" cy="200" r="70"></circle>
            <g id="radialBars"></g>
            <g id="timeLabels" transform="translate(200,200)"></g>
            <g id="valueLabels" transform="translate(200,200)"></g>
            <g transform="translate(200,200)">
                <text id="counterLabel" text-anchor="middle" alignment-baseline="middle" pointer-events="none"></text>
            </g>
        </svg>
    </main>
</body>

</html>
